<title>牛津自然拼读 · 26个字母练习</title>
<style>
  :root{
    --bg:#fff7e6; --card:#ffffff; --ink:#4a3728; --muted:#9b8b7a;
    --blue:#4da6ff; --green:#4cd97b; --orange:#ffa94d; --pink:#ff6b9d; --purple:#a06bff; --yellow:#ffd43b; --red:#ff6b6b;
    --r:22px; --shadow:0 6px 18px rgba(74,55,40,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#fff3d6 0%,#ffe9f3 55%,#e8f4ff 100%);
    color:var(--ink); min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 4px;}
  h1{font-size:20px;margin:0;color:#c96a2b;letter-spacing:1px;}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:normal;letter-spacing:0;}
  .hdr-btns{display:flex;gap:8px;align-items:center;}
  .icon-btn{font-size:22px;width:46px;height:46px;border-radius:14px;border:2px solid #f0dcc0;background:#fff;cursor:pointer;box-shadow:var(--shadow);}
  .icon-btn:active{transform:scale(.92);}
  .switch{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #f0dcc0;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);user-select:none;}
  .switch input{display:none;}
  .switch .dot{width:34px;height:18px;border-radius:10px;background:#d8d0c4;position:relative;transition:.2s;}
  .switch .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;}
  .switch input:checked + .dot{background:var(--green);}
  .switch input:checked + .dot::after{left:18px;}
  #starsBadge{background:#fff;border:2px solid #f5d76e;border-radius:14px;padding:6px 12px;font-weight:800;color:#e6a800;box-shadow:var(--shadow);font-size:14px;white-space:nowrap;}

  nav{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap;}
  nav button{flex:1;min-width:120px;padding:12px 6px;font-size:16px;font-weight:800;border-radius:16px;border:2px solid transparent;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:.15s;}
  nav button.active{background:linear-gradient(135deg,#ffb347,#ff6b6b);color:#fff;border-color:#ff8f5e;transform:translateY(-1px);}
  nav button:active{transform:scale(.95);}
  nav button .ic{font-size:22px;display:block;}

  section{display:none;animation:pop .25s ease;}
  section.show{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
  .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;}
  .letter-tile{border:none;border-radius:16px;padding:10px 4px;cursor:pointer;box-shadow:var(--shadow);font-weight:800;color:#fff;transition:.15s;}
  .letter-tile:hover{transform:translateY(-3px) scale(1.03);}
  .letter-tile:active{transform:scale(.94);}
  .letter-tile .up{font-size:30px;line-height:1.1;}
  .letter-tile .lo{font-size:18px;opacity:.9;}
  .letter-tile .w{font-size:11px;opacity:.95;font-weight:600;}

  .learn-view{display:none;}
  .learn-view.show{display:block;animation:pop .25s ease;}
  .big-letter{display:flex;gap:20px;align-items:center;justify-content:center;padding:10px 0 4px;}
  .big-letter .box{flex:1;max-width:170px;text-align:center;background:linear-gradient(160deg,#fff,#fdf3e3);border-radius:20px;box-shadow:inset 0 0 0 3px #f0dcc0;padding:10px 6px;}
  .big-letter .box .l{font-size:120px;line-height:1;font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;}
  .big-letter .box .cap{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px;}
  .sound-sym{font-size:15px;font-weight:700;color:var(--orange);text-align:center;margin:2px 0 10px;}
  .play-big{display:block;margin:0 auto 14px;font-size:17px;font-weight:800;padding:14px 26px;border:none;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4da6ff,#6a5cff);box-shadow:var(--shadow);}
  .play-big:active{transform:scale(.95);}
  .word-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .word-chip{background:#fff;border:3px solid #f0dcc0;border-radius:16px;padding:10px 12px;cursor:pointer;text-align:center;min-width:110px;box-shadow:var(--shadow);transition:.15s;}
  .word-chip:hover{transform:translateY(-2px);}
  .word-chip:active{transform:scale(.94);}
  .word-chip .e{font-size:38px;line-height:1.2;}
  .word-chip .w{font-size:20px;font-weight:800;color:var(--blue);}
  .word-chip .c{font-size:12px;color:var(--muted);font-weight:600;}
  .nav-row{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
  .nav-row button{border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);color:var(--ink);}
  .nav-row button:active{transform:scale(.94);}
  .nav-row .back{color:var(--muted);}

  .trace-top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .trace-top button{border:none;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .case-toggle{display:flex;background:#eee7da;border-radius:14px;padding:4px;gap:4px;}
  .case-toggle button{border:none;border-radius:10px;padding:8px 16px;font-size:18px;font-weight:800;cursor:pointer;background:transparent;color:var(--muted);}
  .case-toggle button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  canvas{width:100%;max-width:820px;height:auto;display:block;margin:0 auto;background:#fffdf7;border-radius:18px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair;}
  .trace-hint{text-align:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:10px;}
  .stroke-box{margin-top:16px;text-align:center;}
  .stroke-box .t{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:6px;}
  .stroke-box svg{max-width:220px;width:100%;height:auto;}

  .quiz-modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .quiz-modes button{flex:1;min-width:140px;border:none;border-radius:16px;padding:14px 8px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .quiz-modes button.active{background:linear-gradient(135deg,#4cd97b,#4da6ff);color:#fff;}
  .q-prompt{text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;}
  .q-prompt .emoji{font-size:80px;line-height:1.1;}
  .q-prompt .word{font-size:34px;font-weight:800;color:var(--purple);}
  .q-prompt .cn{font-size:15px;color:var(--muted);font-weight:700;}
  .q-prompt .hear{font-size:64px;}
  .q-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;}
  @media(min-width:560px){.q-options{grid-template-columns:repeat(4,1fr);}}

  .daily-medal{text-align:center;font-size:24px;font-weight:800;margin:8px 0 4px;}

  .daily-next{text-align:center;font-size:12px;color:var(--muted);font-weight:700;}

  .app-footer{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:14px 0 4px;}
  .daily-mini{background:#fff;border:2px solid #f5d76e;border-radius:12px;padding:5px 9px;font-size:14px;box-shadow:var(--shadow);}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);background:rgba(74,55,40,.94);color:#fff;padding:14px 22px;border-radius:16px;font-size:16px;font-weight:800;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:88vw;text-align:center;}

<div class="wrap">
  <header>

/* ================= 工具 ================= */
function $(id){return document.getElementById(id);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function letterColor(i){return PALETTE[i%PALETTE.length];}
var muted=false;
function clearSpk(){
  if(window.__spkTimer){clearTimeout(window.__spkTimer);window.__spkTimer=null;}
  if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
}
function primeSpeech(){if('speechSynthesis' in window){try{window.speechSynthesis.getVoices();}catch(e){}}}
var audioCtx=null;
function unlockAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
}
function ensureAudio(){
  if(muted)return null;
  unlockAudio();
  return audioCtx;
}
// 任意点击/触摸先解锁音频（这样书写"自动检查"等非手势触发的音效能正常播放）
document.addEventListener('pointerdown',function(){unlockAudio();},{passive:true});
document.addEventListener('keydown',function(){unlockAudio();});
function playTone(freq,dur,type,vol,when){
  var ac=ensureAudio();if(!ac)return;
  try{
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    var t=ac.currentTime+(when||0);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function playCorrect(n){
  // 答对：清脆上行音（默认三连音，n===2 用两连音）
  var seq=(n===2)?[659.25,880]:[523.25,659.25,783.99];
  for(var i=0;i<seq.length;i++){playTone(seq[i],0.16,'sine',0.24,i*0.13);}
}
function playWrong(){
  // 答错：低沉"嘟-嘟"提示音
  playTone(220,0.2,'sawtooth',0.15,0);
  playTone(164.81,0.26,'sawtooth',0.15,0.2);
}
function playNeutral(){
  // 中性提示音
  playTone(440,0.15,'sine',0.18,0);
}
function speak(text,rate,pitch){
  if(muted||!('speechSynthesis' in window))return;
  clearSpk();
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate||0.82;
    if(pitch)u.pitch=pitch;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakChunks(chunks,opts){
  if(muted||!('speechSynthesis' in window)||!chunks||!chunks.length)return;
  clearSpk();
  var gap=(opts&&opts.gap)||320,i=0;
  function next(){
    if(i>=chunks.length)return;
    var c=chunks[i++];
    var u=new SpeechSynthesisUtterance(c.t);
    u.lang=c.lang||'en-US';u.rate=c.rate||0.75;
    if(c.pitch)u.pitch=c.pitch;
    u.onend=function(){window.__spkTimer=setTimeout(next,gap);};
    try{window.speechSynthesis.speak(u);}catch(e){next();}
  }
  next();
}

function playEmbedded(uri,done){
  if(!uri){if(done)done();return;}
  try{
    var a=new Audio(uri);
    var fin=false;
    function end(){if(fin)return;fin=true;if(done)done();}
    a.onended=end;a.onerror=end;
    var p=a.play();
    if(p&&p.catch){p.catch(end);}
  }catch(e){if(done)done();}
}
function playWord(word,done){
  if(muted){if(done)done();return;}
  playEmbedded(WORD_AUDIO[word],done);
}
function playSentence(s,done){
  if(muted){if(done)done();return;}
  playEmbedded(SENT_AUDIO[s],done);
}

function confetti(){
  var colors=['#ff6b6b','#ffd43b','#4cd97b','#4da6ff','#ff6b9d','#a06bff'];
  for(var i=0;i<36;i++){
    var d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDelay=(Math.random()*0.6)+'s';
    d.style.transform='rotate('+(Math.random()*360)+'deg)';

    (function(el){setTimeout(function(){el.remove();},2600);})(d);
  }
}

var opfDayStars=0,opfDayDate='';
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
}
function medalFor(stars){
  var m=null;
  for(var i=0;i<MEDALS.length;i++){if(stars>=MEDALS[i].min)m=MEDALS[i];}
  return m;
}
function nextMedal(stars){
  for(var i=0;i<MEDALS.length;i++){if(stars<MEDALS[i].min)return MEDALS[i];}
  return null;
}
function renderDaily(){
  var m=medalFor(opfDayStars),nm=nextMedal(opfDayStars);
  $('dailyDate').textContent=opfDayDate;
  $('dailyStars').textContent='今日 ⭐ '+opfDayStars;
  $('dailyMedal').textContent=m?(m.em+' '+m.name):'🥉 青铜 · 等你点亮';
  $('dailyMini').textContent=m?m.em:'🏅';
  var bar=$('dailyBar');
  if(nm){
    var prev=0;
    for(var i=0;i<MEDALS.length;i++){if(MEDALS[i].min<nm.min)prev=MEDALS[i].min;}
    var pct=Math.max(0,Math.min(100,Math.round((opfDayStars-prev)/(nm.min-prev)*100)));
    bar.innerHTML='<i style="width:'+pct+'%"></i>';
    $('dailyNext').textContent='距 '+nm.em+' '+nm.name+' 还差 '+(nm.min-opfDayStars)+' 颗 ⭐';
  }else{
    bar.innerHTML='<i style="width:100%"></i>';
    $('dailyNext').textContent='今日已达最高荣誉：'+m.name+'！👑';
  }
}
function dailyInit(){
  var today=todayStr(),saved='',ds=0;
  try{saved=localStorage.getItem('opfDayDate')||'';ds=parseInt(localStorage.getItem('opfDayStars')||'0',10);}catch(e){}
  if(saved!==today){ds=0;}
  opfDayDate=today;opfDayStars=ds;
  try{localStorage.setItem('opfDayDate',today);localStorage.setItem('opfDayStars',String(ds));}catch(e){}
  $('starsBadge').textContent='⭐ '+ds;
  renderDaily();
}
function addStars(n){
  var t=0;try{t=parseInt(localStorage.getItem('opfStars')||'0',10);}catch(e){}
  t+=n;opfDayStars+=n;
  try{localStorage.setItem('opfStars',String(t));localStorage.setItem('opfDayStars',String(opfDayStars));localStorage.setItem('opfDayDate',opfDayDate||todayStr());}catch(e){}
  $('starsBadge').textContent='⭐ '+opfDayStars;

  var s=getStats(),badges=document.querySelectorAll('.tile-badge');
  for(var i=0;i<badges.length;i++){
    var m=Math.min(s[i][0],3),ds=badges[i].querySelectorAll('.d');
    for(var j=0;j<ds.length;j++){ds[j].classList.toggle('on',j<m);}

var alphabetTimer=null;

  var tiles=document.querySelectorAll('#letterGrid .letter-tile');
  for(var j=0;j<tiles.length;j++){tiles[j].classList.toggle('playing',j===i);}
}
function stopAlphabet(){
  if(alphabetTimer){clearInterval(alphabetTimer);alphabetTimer=null;}
  highlightTile(-1);
  var b=$('alphabetPlay');if(b)b.textContent='🔁 连播字母表';
}
function playAlphabet(){
  if(alphabetTimer){stopAlphabet();return;}
  $('alphabetPlay').textContent='⏹ 停止连播';
  var i=0;
  speakLetter(0);highlightTile(0);
  alphabetTimer=setInterval(function(){
    i++;
    if(i>=26){stopAlphabet();toast('字母表连播结束啦！🎉');confetti();return;}
    speakLetter(i);highlightTile(i);
  },2100);
}

var trIdx=0,trCase='up',trMode='letter',trWordIdx=0,inkDrawn=false,gradeShown=false,gradeTimer=null;
var canvas=$('traceCanvas'),ctx=canvas.getContext('2d'),drawing=false;
function setupCanvas(){
  var dpr=window.devicePixelRatio||1;
  canvas.width=820*dpr;canvas.height=460*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawGhost();
}
function ghostSpec(){
  var L=LETTERS[trIdx];
  if(trMode==='word'){
    var w=L.w[trWordIdx];
    return {text:w[0],font:110,x:410,y:330};
  }
  return {text:trCase==='up'?L.n:L.l,font:300,x:410,y:trCase==='up'?350:390};
}
function drawGhost(){
  ctx.clearRect(0,0,820,460);
  ctx.lineWidth=3;ctx.strokeStyle='#f0e8d8';
  ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(20,70);ctx.lineTo(800,70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,390);ctx.lineTo(800,390);ctx.stroke();
  ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(20,230);ctx.lineTo(800,230);ctx.stroke();
  ctx.setLineDash([]);
  var g=ghostSpec();
  ctx.fillStyle='rgba(140,130,120,0.35)';
  ctx.font='bold '+g.font+'px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(g.text,g.x,g.y);
}
function canvasPos(e){
  var r=canvas.getBoundingClientRect();
  var sx=820/r.width,sy=460/r.height;
  var p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-r.left)*sx,y:(p.clientY-r.top)*sy};
}
canvas.addEventListener('pointerdown',function(e){
  unlockAudio();
  e.preventDefault();drawing=true;inkDrawn=false;gradeShown=false;
  if(gradeTimer){clearTimeout(gradeTimer);gradeTimer=null;}
  ctx.beginPath();var p=canvasPos(e);ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',function(e){
  if(!drawing)return;e.preventDefault();var p=canvasPos(e);
  ctx.lineWidth=16;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#4da6ff';
  ctx.lineTo(p.x,p.y);ctx.stroke();
  inkDrawn=true;
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  canvas.addEventListener(ev,function(){
    if(ev==='pointerup'){
      if(gradeTimer)clearTimeout(gradeTimer);
      gradeTimer=setTimeout(function(){
        if(!drawing&&inkDrawn&&!gradeShown)gradeWriting(true);
      },2500);
    }
    drawing=false;
  });
});
function gradeWriting(auto){
  var W=canvas.width,H=canvas.height,dpr=window.devicePixelRatio||1;
  var off=document.createElement('canvas');off.width=W;off.height=H;
  var oc=off.getContext('2d');
  oc.setTransform(dpr,0,0,dpr,0,0);
  oc.clearRect(0,0,820,460);
  oc.fillStyle='#000';
  var g=ghostSpec();
  oc.font='bold '+g.font+'px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive';
  oc.textAlign='center';oc.textBaseline='alphabetic';
  oc.fillText(g.text,g.x,g.y);
  var ud=ctx.getImageData(0,0,W,H).data,rd=oc.getImageData(0,0,W,H).data;
  var user=0,ref=0,overlap=0;
  for(var i=0;i<ud.length;i+=4){
    var r=ud[i],gg=ud[i+1],b=ud[i+2],a=ud[i+3];
    var isInk=a>128&&b>180&&gg>110&&r<180;
    var isRef=rd[i+3]>128&&rd[i]<128;
    if(isRef)ref++;
    if(isInk){user++;if(isRef)overlap++;}
  }
  if(user<300){playNeutral();showGrade('还没开始写哦，先沿着浅色字描一描 ✍️',0,0);return;}
  var coverage=ref>0?overlap/ref:0,precision=user>0?overlap/user:0;
  var score=coverage*precision;
  var stars=score>=0.32?3:(score>=0.16?2:(score>=0.07?1:0));
  if(stars===3){showGrade('太棒了，写得真漂亮！🌟',stars,score);addStars(2);confetti();playCorrect();}
  else if(stars===2){showGrade('不错哦，再写仔细一点更好！👍',stars,score);addStars(1);playCorrect(2);}
  else if(stars===1){showGrade('有进步，多描几次就能写好！💪',stars,score);playNeutral();}
  else{showGrade('还没写准，沿着浅色字慢慢描哦 🤗',stars,score);playWrong();}
  gradeShown=true;
}
function showGrade(msg,stars,score){
  var gb=$('gradeBox');
  gb.style.display='';
  var h='';
  for(var i=0;i<3;i++){h+='<span class="'+(i<stars?'':'off')+'">⭐</span>';}
  if(stars===0)h='<span style="opacity:.25">⭐⭐⭐</span>';
  $('gradeStars').innerHTML=h;
  $('gradeMsg').textContent=msg;
  gb.setAttribute('data-score',String(Math.round(score*1000)/1000));
}

function renderStrokeBox(strokes,label){
  var paths=strokes.reduce(function(a,b){return a.concat(b);},[]);
  var html='<div class="t">✏️ 笔画顺序（'+label+'）</div><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">';
  html+='<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e64980"/></marker></defs>';
  var n=1;
  strokes.forEach(function(grp){
    grp.forEach(function(d,i){
      var last=i===grp.length-1;
      html+='<path d="'+d+'" fill="none" stroke="'+(last?'#e64980':'#adb5bd')+'" stroke-width="2.5" '+(last?'marker-end="url(#arr)"':'')+'/>';
    });
    var p=grp[grp.length-1].match(/-?[\d.]+/g).map(Number);
    var mx=(p[0]+p[p.length-2])/2,my=(p[1]+p[p.length-1])/2;
    html+='<text x="'+(mx+4)+'" y="'+(my-4)+'" font-size="9" font-weight="bold" fill="#1971c2">'+n+'</text>';
    n++;
  });
  html+='</svg>';
  return html;
}

}
function renderSent(){
  var si=sentList[sentIdx],S=SENT_QUIZ[si];
  $('sentProgress').innerHTML='第 '+(sentIdx+1)+' 题 / 共 '+sentList.length+' 题 · 答对 '+sentCorrect+' 题'+
    '<div class="bar"><i style="width:'+(sentIdx/sentList.length*100)+'%"></i></div>';
  $('sentPrompt').innerHTML='<div class="sent-scene">'+S.em+'</div>'+
    '<div class="sent-hint">'+S.cn+'</div>'+
    '<button class="q-replay" id="sentReplay">🔊 听一听怎么说</button>';
  var opts=shuffle([S.q].concat(S.dist.slice()));
  var h='';
  opts.forEach(function(o){
    h+='<button class="s-opt" data-t="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>';
  });
  $('sentOptions').innerHTML=h;
  $('sentReplay').onclick=function(){playSentence(S.q);};
}
$('sentOptions').addEventListener('click',function(e){
  var b=e.target.closest('.s-opt');if(!b||sentBusy)return;
  sentBusy=true;var S=SENT_QUIZ[sentList[sentIdx]];
  var btns=$('sentOptions').querySelectorAll('.s-opt'),correctBtn=null;
  btns.forEach(function(x){if(x.textContent.trim()===S.q)correctBtn=x;});
  if(b.textContent.trim()===S.q){
    playCorrect();
    b.classList.add('correct');sentCorrect++;
    toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    confetti();
    playSentence(S.q);
  }else{
    playWrong();
    b.classList.add('wrong');if(correctBtn)correctBtn.classList.add('correct');
    toast(ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]);
    playSentence(S.q);
  }
  setTimeout(function(){
    sentIdx++;
    if(sentIdx>=sentList.length)finishSent();
    else{sentBusy=false;renderSent();}
  },1400);
});
function finishSent(){
  var stars=sentCorrect>=sentList.length?3:(sentCorrect/sentList.length>=0.7?2:1);
  $('sentPrompt').style.display='none';$('sentOptions').style.display='none';
  $('sentEndTitle').textContent=sentCorrect===sentList.length?'全对，句型小达人！':'句型闯关完成！';
  $('sentEndScore').textContent='答对 '+sentCorrect+' / '+sentList.length+' 题';
  showEndStars($('sentEndStars'),stars);
  $('sentEnd').classList.add('show');
  addStars(stars);
  if(stars===3)confetti();
}
$('sentAgain').addEventListener('click',newSent);
function showSentPane(which){
  $('sentLearnTab').classList.toggle('active',which==='learn');
  $('sentQuizTab').classList.toggle('active',which==='quiz');
  $('sentOrderTab').classList.toggle('active',which==='order');
  $('sentLearn').classList.toggle('show',which==='learn');
  $('sentQuiz').classList.toggle('show',which==='quiz');
  $('sentOrder').classList.toggle('show',which==='order');
}
$('sentLearnTab').addEventListener('click',function(){showSentPane('learn');});
$('sentQuizTab').addEventListener('click',function(){showSentPane('quiz');});
$('sentOrderTab').addEventListener('click',function(){showSentPane('order');newSentOrder();});

/* ================= 组句 ================= */
var ORDER_LEN=6;
var orderList=[],orderIdx=0,orderScore=0,orderBusy=false;
function sentWordsOf(S){return S.q.replace(/\./g,'').split(' ');}
function newSentOrder(){
  orderList=shuffle(SENT_QUIZ.map(function(_,i){return i;})).slice(0,ORDER_LEN);
  orderIdx=0;orderScore=0;orderBusy=false;
  $('sentOrderEnd').classList.remove('show');
  $('sentOrderPrompt').style.display='';$('orderAnswer').style.display='';$('orderBank').style.display='';
  renderSentOrder();
}
function renderSentOrder(){
  var si=orderList[orderIdx],S=SENT_QUIZ[si],words=sentWordsOf(S);
  $('sentOrderProgress').innerHTML='第 '+(orderIdx+1)+' 题 / 共 '+orderList.length+' 题 · 排对 '+orderScore+' 题'+
    '<div class="bar"><i style="width:'+(orderIdx/orderList.length*100)+'%"></i></div>';
  $('sentOrderPrompt').innerHTML='<div class="sent-scene">'+S.em+'</div>'+
    '<div class="sent-hint">'+S.cn+'</div>'+
    '<button class="q-replay" id="orderReplay">🔊 听句子</button>';
  var rp=$('orderReplay');if(rp)rp.onclick=function(){playSentence(S.q);};
  $('orderAnswer').innerHTML='';
  $('orderBank').innerHTML='';
  var bank=shuffle(words.slice());
  bank.forEach(function(w){
    var b=document.createElement('button');
    b.className='word-chip2';b.textContent=w;b.setAttribute('data-w',w);
    $('orderBank').appendChild(b);
  });
  $('orderAnswer').classList.remove('wrong');
  $('orderAnswer').style.outline='';
}
function checkOrder(){
  var si=orderList[orderIdx],S=SENT_QUIZ[si],words=sentWordsOf(S);
  var placed=$('orderAnswer').querySelectorAll('.word-chip2');
  if(placed.length<words.length)return;
  var ok=true;
  for(var i=0;i<words.length;i++){if(placed[i].textContent!==words[i]){ok=false;break;}}
  if(ok){
    orderScore++;orderBusy=true;
    playCorrect();
    $('orderAnswer').style.outline='3px solid #4cd97b';
    toast('句子排对啦！🎉');confetti();
    setTimeout(function(){
      orderBusy=false;
      orderIdx++;
      if(orderIdx>=orderList.length)finishSentOrder();
      else{renderSentOrder();}
    },1300);
  }else{
    playWrong();
    $('orderAnswer').classList.remove('wrong');void $('orderAnswer').offsetWidth;$('orderAnswer').classList.add('wrong');
    toast('顺序不太对，再试试！🔁');
    var pl=$('orderAnswer').querySelectorAll('.word-chip2');
    for(var k=pl.length-1;k>=0;k--){$('orderBank').appendChild(pl[k]);pl[k].classList.remove('placed');}
  }
}
function finishSentOrder(){
  var stars=orderScore>=orderList.length?3:(orderScore/orderList.length>=0.7?2:1);
  $('sentOrderPrompt').style.display='none';$('orderAnswer').style.display='none';$('orderBank').style.display='none';
  $('sentOrderEndTitle').textContent=orderScore===orderList.length?'全对，组句小达人！':'组句完成！';
  $('sentOrderEndScore').textContent='排对 '+orderScore+' / '+orderList.length+' 题';
  showEndStars($('sentOrderEndStars'),stars);
  $('sentOrderEnd').classList.add('show');
  addStars(stars);
  if(stars===3)confetti();
}
$('sentOrderAgain').addEventListener('click',newSentOrder);
$('orderReset').addEventListener('click',function(){
  if(orderBusy)return;
  var pl=$('orderAnswer').querySelectorAll('.word-chip2');
  for(var k=pl.length-1;k>=0;k--){$('orderBank').appendChild(pl[k]);pl[k].classList.remove('placed');}
});
// 点选 / 拖动组句（委托监听，避免重复绑定）
var dragChip=null,dragMoved=false,dragSX=0,dragSY=0;
$('sentOrder').addEventListener('pointerdown',function(e){
  var b=e.target.closest('.word-chip2');
  if(!b||orderBusy)return;
  dragChip=b;dragMoved=false;dragSX=e.clientX;dragSY=e.clientY;
  try{b.setPointerCapture(e.pointerId);}catch(err){}
});
$('sentOrder').addEventListener('pointermove',function(e){
  if(!dragChip)return;
  var dx=e.clientX-dragSX,dy=e.clientY-dragSY;
  if(!dragMoved&&Math.abs(dx)+Math.abs(dy)>10){dragMoved=true;}
  if(dragMoved){
    dragChip.style.position='fixed';dragChip.style.left=(e.clientX-34)+'px';
    dragChip.style.top=(e.clientY-20)+'px';dragChip.style.zIndex='999';
    dragChip.classList.add('dragging');
  }
});
$('sentOrder').addEventListener('pointerup',function(e){
  if(!dragChip)return;
  var b=dragChip;
  if(dragMoved){
    var ans=$('orderAnswer').getBoundingClientRect();
    var inAns=e.clientX>=ans.left&&e.clientX<=ans.right&&e.clientY>=ans.top&&e.clientY<=ans.bottom;
    if(inAns&&!$('orderAnswer').contains(b)){
      $('orderAnswer').appendChild(b);b.classList.add('placed');checkOrder();
    }else if(!inAns&&$('orderAnswer').contains(b)){
      $('orderBank').appendChild(b);b.classList.remove('placed');
    }
    b.style.position='';b.style.left='';b.style.top='';b.style.zIndex='';b.classList.remove('dragging');
    b._suppressClick=true;setTimeout(function(){b._suppressClick=false;},80);
  }
  dragChip=null;
});
$('sentOrder').addEventListener('click',function(e){
  var b=e.target.closest('.word-chip2');
  if(!b||orderBusy||b._suppressClick)return;
  var ans=$('orderAnswer');
  if(ans.contains(b)){
    $('orderBank').appendChild(b);b.classList.remove('placed');
  }else{
    ans.appendChild(b);b.classList.add('placed');checkOrder();
  }
});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛津自然拼读 · 26个字母练习</title>
<style>
  :root{
    --bg:#fff7e6; --card:#ffffff; --ink:#4a3728; --muted:#9b8b7a;
    --blue:#4da6ff; --green:#4cd97b; --orange:#ffa94d; --pink:#ff6b9d; --purple:#a06bff; --yellow:#ffd43b; --red:#ff6b6b;
    --r:22px; --shadow:0 6px 18px rgba(74,55,40,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#fff3d6 0%,#ffe9f3 55%,#e8f4ff 100%);
    color:var(--ink); min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto;padding:14px 14px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 4px;}
  h1{font-size:20px;margin:0;color:#c96a2b;letter-spacing:1px;}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:normal;letter-spacing:0;}
  .hdr-btns{display:flex;gap:8px;align-items:center;}
  .icon-btn{font-size:22px;width:46px;height:46px;border-radius:14px;border:2px solid #f0dcc0;background:#fff;cursor:pointer;box-shadow:var(--shadow);}
  .icon-btn:active{transform:scale(.92);}
  .switch{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #f0dcc0;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);user-select:none;}
  .switch input{display:none;}
  .switch .dot{width:34px;height:18px;border-radius:10px;background:#d8d0c4;position:relative;transition:.2s;}
  .switch .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;}
  .switch input:checked + .dot{background:var(--green);}
  .switch input:checked + .dot::after{left:18px;}
  #starsBadge{background:#fff;border:2px solid #f5d76e;border-radius:14px;padding:6px 12px;font-weight:800;color:#e6a800;box-shadow:var(--shadow);font-size:14px;white-space:nowrap;}

  nav{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap;}
  nav button{flex:1;min-width:120px;padding:12px 6px;font-size:16px;font-weight:800;border-radius:16px;border:2px solid transparent;background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:.15s;}
  nav button.active{background:linear-gradient(135deg,#ffb347,#ff6b6b);color:#fff;border-color:#ff8f5e;transform:translateY(-1px);}
  nav button:active{transform:scale(.95);}
  nav button .ic{font-size:22px;display:block;}

  section{display:none;animation:pop .25s ease;}
  section.show{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
  .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;}
  .letter-tile{border:none;border-radius:16px;padding:10px 4px;cursor:pointer;box-shadow:var(--shadow);font-weight:800;color:#fff;transition:.15s;}
  .letter-tile:hover{transform:translateY(-3px) scale(1.03);}
  .letter-tile:active{transform:scale(.94);}
  .letter-tile .up{font-size:30px;line-height:1.1;}
  .letter-tile .lo{font-size:18px;opacity:.9;}
  .letter-tile .w{font-size:11px;opacity:.95;font-weight:600;}

  .learn-view{display:none;}
  .learn-view.show{display:block;animation:pop .25s ease;}
  .big-letter{display:flex;gap:20px;align-items:center;justify-content:center;padding:10px 0 4px;}
  .big-letter .box{flex:1;max-width:170px;text-align:center;background:linear-gradient(160deg,#fff,#fdf3e3);border-radius:20px;box-shadow:inset 0 0 0 3px #f0dcc0;padding:10px 6px;}
  .big-letter .box .l{font-size:120px;line-height:1;font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;}
  .big-letter .box .cap{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:1px;}
  .sound-sym{font-size:15px;font-weight:700;color:var(--orange);text-align:center;margin:2px 0 10px;}
  .play-big{display:block;margin:0 auto 14px;font-size:17px;font-weight:800;padding:14px 26px;border:none;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4da6ff,#6a5cff);box-shadow:var(--shadow);}
  .play-big:active{transform:scale(.95);}
  .word-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .word-chip{background:#fff;border:3px solid #f0dcc0;border-radius:16px;padding:10px 12px;cursor:pointer;text-align:center;min-width:110px;box-shadow:var(--shadow);transition:.15s;}
  .word-chip:hover{transform:translateY(-2px);}
  .word-chip:active{transform:scale(.94);}
  .word-chip .e{font-size:38px;line-height:1.2;}
  .word-chip .w{font-size:20px;font-weight:800;color:var(--blue);}
  .word-chip .c{font-size:12px;color:var(--muted);font-weight:600;}
  .nav-row{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
  .nav-row button{border:none;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);color:var(--ink);}
  .nav-row button:active{transform:scale(.94);}
  .nav-row .back{color:var(--muted);}

  .trace-top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .trace-top button{border:none;border-radius:14px;padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .case-toggle{display:flex;background:#eee7da;border-radius:14px;padding:4px;gap:4px;}
  .case-toggle button{border:none;border-radius:10px;padding:8px 16px;font-size:18px;font-weight:800;cursor:pointer;background:transparent;color:var(--muted);}
  .case-toggle button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  canvas{width:100%;max-width:820px;height:auto;display:block;margin:0 auto;background:#fffdf7;border-radius:18px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair;}
  .trace-hint{text-align:center;font-size:14px;color:var(--muted);font-weight:600;margin-top:10px;}
  .stroke-box{margin-top:16px;text-align:center;}
  .stroke-box .t{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:6px;}
  .stroke-box svg{max-width:220px;width:100%;height:auto;}

  .quiz-modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .quiz-modes button{flex:1;min-width:140px;border:none;border-radius:16px;padding:14px 8px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .quiz-modes button.active{background:linear-gradient(135deg,#4cd97b,#4da6ff);color:#fff;}
  .q-prompt{text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;}
  .q-prompt .emoji{font-size:80px;line-height:1.1;}
  .q-prompt .word{font-size:34px;font-weight:800;color:var(--purple);}
  .q-prompt .cn{font-size:15px;color:var(--muted);font-weight:700;}
  .q-prompt .hear{font-size:64px;}
  .q-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;}
  @media(min-width:560px){.q-options{grid-template-columns:repeat(4,1fr);}}
  .q-opt{border:none;border-radius:18px;padding:16px 6px;font-weight:800;color:#fff;font-size:34px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;}
  .q-opt .sm{display:block;font-size:18px;opacity:.92;}
  .q-opt:hover{transform:translateY(-2px);}
  .q-opt:active{transform:scale(.94);}
  .q-opt.correct{outline:5px solid var(--green);animation:bounce .4s;}
  .q-opt.wrong{outline:5px solid var(--red);opacity:.55;}
  @keyframes bounce{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}
  .q-progress{text-align:center;font-weight:800;color:var(--muted);font-size:15px;margin-bottom:8px;}
  .q-progress .bar{height:10px;background:#eee7da;border-radius:6px;margin-top:6px;overflow:hidden;}
  .q-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,#4cd97b,#ffd43b);border-radius:6px;transition:width .3s;}

  .end-view{display:none;text-align:center;padding:24px 10px;}
  .end-view.show{display:block;animation:pop .3s ease;}
  .end-view .big{font-size:56px;}
  .end-view h3{font-size:26px;margin:8px 0;}
  .stars-row{font-size:52px;letter-spacing:8px;margin:10px 0;}
  .stars-row .off{opacity:.22;}
  .end-view .score{font-size:18px;color:var(--muted);font-weight:700;margin-bottom:14px;}
  .end-view button{border:none;border-radius:16px;padding:14px 30px;font-size:17px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ffb347,#ff6b6b);color:#fff;box-shadow:var(--shadow);}

  .match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;margin:0 auto;}
  @media(min-width:600px){.match-grid{grid-template-columns:repeat(6,1fr);}}
  .m-card{aspect-ratio:1/1;border-radius:16px;font-size:36px;font-weight:800;cursor:pointer;border:none;background:#fff;color:var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:.15s;}
  .m-card .face{display:none;}
  .m-card .back{display:none;font-size:26px;color:#c9bda5;}
  .m-card.show .face{display:block;}
  .m-card.hide{background:#f2ead8;color:#c9bda5;font-size:26px;box-shadow:none;}
  .m-card.hide .face{display:none;}
  .m-card.hide .back{display:block;}
  .m-card.matched{opacity:1;pointer-events:none;transform:scale(1);outline:3px solid #4cd97b;box-shadow:0 0 0 4px rgba(76,217,123,.25);}
  .match-info{text-align:center;font-weight:800;color:var(--muted);margin-bottom:12px;font-size:15px;}

  .learn-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .learn-tools .legend{font-size:12px;color:var(--muted);font-weight:700;}
  .alphabet-play{border:none;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#a06bff,#ff6b9d);color:#fff;box-shadow:var(--shadow);white-space:nowrap;}
  .alphabet-play:active{transform:scale(.95);}
  .letter-tile{position:relative;}
  .letter-tile.playing{outline:5px solid #fff;transform:scale(1.06);z-index:2;}
  .tile-badge{position:absolute;top:-7px;right:-7px;background:#fff;border-radius:9px;padding:3px 5px;box-shadow:var(--shadow);display:flex;gap:2px;border:1px solid #f0e0c0;}
  .tile-badge .d{width:7px;height:7px;border-radius:50%;background:#e8dfce;}
  .tile-badge .d.on{background:#ffd43b;}
  .quiz-review{margin-top:14px;border:none;border-radius:16px;padding:12px 22px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#a06bff,#4da6ff);color:#fff;box-shadow:var(--shadow);}
  .quiz-review:active{transform:scale(.95);}
  .trace-mode{display:flex;gap:8px;margin-bottom:10px;}
  .trace-mode button{flex:1;border:none;border-radius:14px;padding:10px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .trace-mode button.active{background:linear-gradient(135deg,#4da6ff,#a06bff);color:#fff;}
  #trCheck{background:#4cd97b;color:#fff;}
  .word-label{text-align:center;font-size:22px;font-weight:800;color:var(--purple);margin:6px 0;}
  .word-label small{display:block;font-size:13px;color:var(--muted);font-weight:600;}
  .grade-box{text-align:center;margin-top:12px;padding:10px;border-radius:14px;background:#fff;box-shadow:var(--shadow);}
  .grade-box .grade-stars{font-size:30px;letter-spacing:4px;display:block;}
  .grade-box .grade-msg{font-size:16px;font-weight:800;color:var(--ink);}
  .q-replay{border:none;border-radius:14px;padding:10px 20px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ffb347,#ff6b6b);color:#fff;box-shadow:var(--shadow);margin-top:8px;}
  .q-replay:active{transform:scale(.95);}
  .match-tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .match-tools .match-info{flex:1;min-width:220px;margin-bottom:0;}
  .sent-tabs{display:flex;gap:10px;margin-bottom:14px;}
  .sent-tabs button{flex:1;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;background:#fff;box-shadow:var(--shadow);}
  .sent-tabs button.active{background:linear-gradient(135deg,#a06bff,#ff6b9d);color:#fff;}
  .sent-pane{display:none;}
  .sent-pane.show{display:block;}
  .pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .pat-card{border:none;border-radius:18px;padding:14px 10px;color:#fff;cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:.15s;}
  .pat-card:hover{transform:translateY(-2px);}
  .pat-card:active{transform:scale(.95);}
  .pat-card .pat-em{font-size:40px;line-height:1.2;}
  .pat-card .pat-p{font-size:18px;font-weight:800;margin:6px 0 2px;}
  .pat-card .pat-ex{font-size:15px;font-weight:700;opacity:.95;}
  .pat-card .pat-cn{font-size:11px;opacity:.9;margin-top:4px;}
  .sent-prompt{text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;}
  .sent-prompt .sent-scene{font-size:70px;line-height:1.2;}
  .sent-prompt .sent-hint{font-size:17px;font-weight:800;color:var(--purple);margin:4px 0 10px;}
  .s-options{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .s-opt{border:none;border-radius:16px;padding:14px 16px;font-size:18px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:var(--shadow);transition:.15s;text-align:center;}
  .s-opt:hover{transform:translateY(-2px);}
  .s-opt:active{transform:scale(.97);}
  .s-opt.correct{outline:5px solid var(--green);background:#eafff0;animation:bounce .4s;}
  .s-opt.wrong{outline:5px solid var(--red);background:#ffecec;opacity:.6;}
  .order-answer{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;border:3px dashed #e0d4c0;border-radius:16px;padding:10px;background:#fffdf7;margin-bottom:12px;align-items:center;justify-content:center;}
  .order-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;min-height:56px;padding:4px;}
  .word-chip2{border:none;border-radius:12px;padding:10px 14px;font-size:19px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:var(--shadow);user-select:none;touch-action:none;-webkit-user-select:none;}
  .word-chip2.placed{background:#eafff0;color:#2f9e44;border:2px solid #4cd97b;box-shadow:none;}
  .word-chip2.dragging{position:fixed;z-index:999;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none;}
  .order-answer .word-chip2{background:#e8f4ff;color:#1971c2;}
  .order-tools{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap;}
  .order-reset{border:none;border-radius:14px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  .order-hint{text-align:center;font-weight:800;color:var(--purple);margin-bottom:8px;font-size:15px;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}75%{transform:translateX(7px);}}
  .order-answer.wrong{animation:shake .4s;}
  .learn-sound-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .play-big.sound-btn{background:linear-gradient(135deg,#4cd97b,#20c997);margin-bottom:0;}
  .daily-card{background:linear-gradient(135deg,#fff8e6,#fff);border:2px solid #f5d76e;border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);}
  .daily-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .daily-date{font-weight:800;color:var(--ink);font-size:14px;}
  .daily-stars{font-weight:800;color:#e6a800;font-size:14px;flex:1;text-align:right;}
  .daily-check{border:none;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#ffb347,#ff6b6b);color:#fff;box-shadow:var(--shadow);}
  .daily-check:active{transform:scale(.95);}
  .daily-medal{text-align:center;font-size:24px;font-weight:800;margin:8px 0 4px;}
  .daily-bar{height:12px;background:#eee7da;border-radius:8px;overflow:hidden;margin:4px 0 6px;}
  .daily-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff9f1a);border-radius:8px;transition:width .3s;}
  .daily-next{text-align:center;font-size:12px;color:var(--muted);font-weight:700;}
  .daily-foot{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:8px;border-top:1px dashed #f0dcc0;padding-top:8px;}
  .app-footer{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:14px 0 4px;}
  .daily-mini{background:#fff;border:2px solid #f5d76e;border-radius:12px;padding:5px 9px;font-size:14px;box-shadow:var(--shadow);}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);background:rgba(74,55,40,.94);color:#fff;padding:14px 22px;border-radius:16px;font-size:16px;font-weight:800;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .confetti{position:fixed;top:-16px;width:12px;height:12px;border-radius:3px;z-index:98;pointer-events:none;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌈 牛津自然拼读 · 第一册<small>26个字母 · 听 / 说 / 读 / 写 / 配对</small></h1>
    <div class="hdr-btns">
      <label class="switch" title="显示中文释义">
        <input type="checkbox" id="cnToggle" checked><span class="dot"></span>中文
      </label>
      <button class="icon-btn" id="soundToggle" title="声音开关">🔊</button>
      <span class="daily-mini" id="dailyMini">🏅</span>
      <span id="starsBadge">⭐ 0</span>
    </div>
  </header>

  <nav>
    <button data-tab="learn" class="active"><span class="ic">📖</span>学习</button>
    <button data-tab="trace"><span class="ic">✍️</span>书写</button>
    <button data-tab="quiz"><span class="ic">🎯</span>练习</button>
    <button data-tab="match"><span class="ic">🃏</span>配对</button>
    <button data-tab="sent"><span class="ic">📝</span>句型</button>
  </nav>

  <!-- 学习 -->
  <section id="learn" class="show">
    <div class="learn-tools">
      <div class="legend">📊 掌握度：每答对一次点亮一颗⭐，点亮 3 颗 = 掌握这个字母（练习/配对里答对都会加）</div>
      <button class="alphabet-play" id="alphabetPlay">🔁 连播字母表</button>
    </div>
    <div class="daily-card" id="dailyCard">
      <div class="daily-row">
        <div class="daily-date">📅 <span id="dailyDate"></span></div>
        <div class="daily-stars" id="dailyStars"></div>
        <button class="daily-check" id="dailyCheck">✅ 今日打卡</button>
      </div>
      <div class="daily-medal" id="dailyMedal"></div>
      <div class="daily-bar" id="dailyBar"><i style="width:0%"></i></div>
      <div class="daily-next" id="dailyNext"></div>
      <div class="daily-foot">🏆 开发归属：嘉兴辰星留学-HU</div>
    </div>
    <div id="letterGrid" class="grid-letters"></div>
    <div id="learnView" class="card learn-view">
      <div class="big-letter">
        <div class="box"><div class="cap">大写</div><div class="l" id="lvUp">A</div></div>
        <div class="box"><div class="cap">小写</div><div class="l" id="lvLo">a</div></div>
      </div>
      <div class="sound-sym" id="lvSound">/æ/</div>
      <div class="learn-sound-btns">
        <button class="play-big" id="lvPlay">🔠 字母名 + 单词</button>
        <button class="play-big sound-btn" id="lvSoundBtn">🔊 听发音</button>
      </div>
      <div class="word-chips" id="lvWords"></div>
      <div class="nav-row">
        <button class="back" id="lvBack">← 返回字母表</button>
        <button id="lvPrev">◀ 上一个</button>
        <button id="lvNext">下一个 ▶</button>
      </div>
    </div>
  </section>

  <!-- 书写 -->
  <section id="trace">
    <div class="card">
      <div class="trace-mode">
        <button id="trModeLetter" class="active">🔤 字母</button>
        <button id="trModeWord">📝 单词</button>
      </div>
      <div class="trace-top">

/* ================= 工具 ================= */
function $(id){return document.getElementById(id);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function letterColor(i){return PALETTE[i%PALETTE.length];}
var muted=false;
function clearSpk(){
  if(window.__spkTimer){clearTimeout(window.__spkTimer);window.__spkTimer=null;}
  if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}
}
function primeSpeech(){if('speechSynthesis' in window){try{window.speechSynthesis.getVoices();}catch(e){}}}
var audioCtx=null;
function unlockAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
}
function ensureAudio(){
  if(muted)return null;
  unlockAudio();
  return audioCtx;
}
// 任意点击/触摸先解锁音频（这样书写"自动检查"等非手势触发的音效能正常播放）
document.addEventListener('pointerdown',function(){unlockAudio();},{passive:true});
document.addEventListener('keydown',function(){unlockAudio();});
function playTone(freq,dur,type,vol,when){
  var ac=ensureAudio();if(!ac)return;
  try{
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    var t=ac.currentTime+(when||0);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function playCorrect(n){
  // 答对：清脆上行音（默认三连音，n===2 用两连音）
  var seq=(n===2)?[659.25,880]:[523.25,659.25,783.99];
  for(var i=0;i<seq.length;i++){playTone(seq[i],0.16,'sine',0.24,i*0.13);}
}
function playWrong(){
  // 答错：低沉"嘟-嘟"提示音
  playTone(220,0.2,'sawtooth',0.15,0);
  playTone(164.81,0.26,'sawtooth',0.15,0.2);
}
function playNeutral(){
  // 中性提示音
  playTone(440,0.15,'sine',0.18,0);
}
function speak(text,rate,pitch){
  if(muted||!('speechSynthesis' in window))return;
  clearSpk();
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=rate||0.82;
    if(pitch)u.pitch=pitch;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakChunks(chunks,opts){
  if(muted||!('speechSynthesis' in window)||!chunks||!chunks.length)return;
  clearSpk();
  var gap=(opts&&opts.gap)||320,i=0;
  function next(){
    if(i>=chunks.length)return;
    var c=chunks[i++];
    var u=new SpeechSynthesisUtterance(c.t);
    u.lang=c.lang||'en-US';u.rate=c.rate||0.75;
    if(c.pitch)u.pitch=c.pitch;
    u.onend=function(){window.__spkTimer=setTimeout(next,gap);};
    try{window.speechSynthesis.speak(u);}catch(e){next();}
  }

function playEmbedded(uri,done){
  if(!uri){if(done)done();return;}
  try{
    var a=new Audio(uri);
    var fin=false;
    function end(){if(fin)return;fin=true;if(done)done();}
    a.onended=end;a.onerror=end;
    var p=a.play();
    if(p&&p.catch){p.catch(end);}
  }catch(e){if(done)done();}
}
function speakLetter(li){
  var L=LETTERS[li];
  if(muted||!PHON_AUDIO)return;
  // 字母名(女声录音) → 常用单词(系统语音，演示字母的拼读音)
  playEmbedded(PHON_AUDIO.name[L.n],function(){
    speak(L.w[0][0],0.58);
  });
}
function speakSound(li){

    {t:L.w[0][0],rate:0.58}
  ],{gap:320});
}
function speakLetterName(li){

  for(var i=0;i<MEDALS.length;i++){if(stars<MEDALS[i].min)return MEDALS[i];}

var trIdx=0,trCase='up',trMode='letter',trWordIdx=0,inkDrawn=false,gradeShown=false,gradeTimer=null;
var canvas=$('traceCanvas'),ctx=canvas.getContext('2d'),drawing=false;
function setupCanvas(){
  var dpr=window.devicePixelRatio||1;
  canvas.width=820*dpr;canvas.height=460*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawGhost();
}
function ghostSpec(){
  var L=LETTERS[trIdx];
  if(trMode==='word'){
    var w=L.w[trWordIdx];
    return {text:w[0],font:110,x:410,y:330};
  }
  return {text:trCase==='up'?L.n:L.l,font:300,x:410,y:trCase==='up'?350:390};
}
function drawGhost(){
  ctx.clearRect(0,0,820,460);
  ctx.lineWidth=3;ctx.strokeStyle='#f0e8d8';
  ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(20,70);ctx.lineTo(800,70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(20,390);ctx.lineTo(800,390);ctx.stroke();
  ctx.setLineDash([10,10]);
  ctx.beginPath();ctx.moveTo(20,230);ctx.lineTo(800,230);ctx.stroke();
  ctx.setLineDash([]);
  var g=ghostSpec();
  ctx.fillStyle='rgba(140,130,120,0.35)';
  ctx.font='bold '+g.font+'px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(g.text,g.x,g.y);
}
function canvasPos(e){
  var r=canvas.getBoundingClientRect();
  var sx=820/r.width,sy=460/r.height;
  var p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-r.left)*sx,y:(p.clientY-r.top)*sy};
}
canvas.addEventListener('pointerdown',function(e){
  unlockAudio();
  e.preventDefault();drawing=true;inkDrawn=false;gradeShown=false;
  if(gradeTimer){clearTimeout(gradeTimer);gradeTimer=null;}
  ctx.beginPath();var p=canvasPos(e);ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',function(e){
  if(!drawing)return;e.preventDefault();var p=canvasPos(e);
  ctx.lineWidth=16;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#4da6ff';
  ctx.lineTo(p.x,p.y);ctx.stroke();
  inkDrawn=true;
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  canvas.addEventListener(ev,function(){
    if(ev==='pointerup'){
      if(gradeTimer)clearTimeout(gradeTimer);
      gradeTimer=setTimeout(function(){
        if(!drawing&&inkDrawn&&!gradeShown)gradeWriting(true);
      },2500);
    }
    drawing=false;
  });
});
function gradeWriting(auto){
  var W=canvas.width,H=canvas.height,dpr=window.devicePixelRatio||1;
  var off=document.createElement('canvas');off.width=W;off.height=H;
  var oc=off.getContext('2d');
  oc.setTransform(dpr,0,0,dpr,0,0);
  oc.clearRect(0,0,820,460);
  oc.fillStyle='#000';
  var g=ghostSpec();
  oc.font='bold '+g.font+'px "Chalkboard SE","Comic Sans MS","Marker Felt",cursive';
  oc.textAlign='center';oc.textBaseline='alphabetic';
  oc.fillText(g.text,g.x,g.y);
  var ud=ctx.getImageData(0,0,W,H).data,rd=oc.getImageData(0,0,W,H).data;
  var user=0,ref=0,overlap=0;
  for(var i=0;i<ud.length;i+=4){
    var r=ud[i],gg=ud[i+1],b=ud[i+2],a=ud[i+3];
    var isInk=a>128&&b>180&&gg>110&&r<180;
    var isRef=rd[i+3]>128&&rd[i]<128;
    if(isRef)ref++;
    if(isInk){user++;if(isRef)overlap++;}
  }
  if(user<300){playNeutral();showGrade('还没开始写哦，先沿着浅色字描一描 ✍️',0,0);return;}
  var coverage=ref>0?overlap/ref:0,precision=user>0?overlap/user:0;
  var score=coverage*precision;
  var stars=score>=0.32?3:(score>=0.16?2:(score>=0.07?1:0));
  if(stars===3){showGrade('太棒了，写得真漂亮！🌟',stars,score);addStars(2);confetti();playCorrect();}
  else if(stars===2){showGrade('不错哦，再写仔细一点更好！👍',stars,score);addStars(1);playCorrect(2);}
  else if(stars===1){showGrade('有进步，多描几次就能写好！💪',stars,score);playNeutral();}
  else{showGrade('还没写准，沿着浅色字慢慢描哦 🤗',stars,score);playWrong();}
  gradeShown=true;
}
function showGrade(msg,stars,score){
  var gb=$('gradeBox');
  gb.style.display='';
  var h='';
  for(var i=0;i<3;i++){h+='<span class="'+(i<stars?'':'off')+'">⭐</span>';}
  if(stars===0)h='<span style="opacity:.25">⭐⭐⭐</span>';
  $('gradeStars').innerHTML=h;
  $('gradeMsg').textContent=msg;
  gb.setAttribute('data-score',String(Math.round(score*1000)/1000));
}

}
function renderStrokeBox(strokes,label){
  var paths=strokes.reduce(function(a,b){return a.concat(b);},[]);
  var html='<div class="t">✏️ 笔画顺序（'+label+'）</div><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">';
  html+='<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#e64980"/></marker></defs>';
  var n=1;
  strokes.forEach(function(grp){
    grp.forEach(function(d,i){
      var last=i===grp.length-1;
      html+='<path d="'+d+'" fill="none" stroke="'+(last?'#e64980':'#adb5bd')+'" stroke-width="2.5" '+(last?'marker-end="url(#arr)"':'')+'/>';
    });
    var p=grp[grp.length-1].match(/-?[\d.]+/g).map(Number);
    var mx=(p[0]+p[p.length-2])/2,my=(p[1]+p[p.length-1])/2;
    html+='<text x="'+(mx+4)+'" y="'+(my-4)+'" font-size="9" font-weight="bold" fill="#1971c2">'+n+'</text>';
    n++;
  });
  html+='</svg>';
  return html;
}

  b.addEventListener('click',function(){
    document.querySelectorAll('.quiz-modes button').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');quizMode=b.getAttribute('data-mode');newQuiz();
  });
});

/* ================= 配对 ================= */
var matchCards=[],matchOpen=[],matchLocked=false,matchMoves=0,matchPairs=0,MATCH_PAIRS=6;
function newMatch(){
  var chosen=shuffle(LETTERS.map(function(_,i){return i;})).slice(0,MATCH_PAIRS);
  matchCards=[];matchOpen=[];matchLocked=false;matchMoves=0;matchPairs=0;lastMatchLi=-1;
  chosen.forEach(function(li){
    matchCards.push({li:li,case:'up',up:true});
    matchCards.push({li:li,case:'lo',up:false});
  });
  matchCards=shuffle(matchCards);
  $('matchEnd').classList.remove('show');
  var h='';
  matchCards.forEach(function(c,i){
    var L=LETTERS[c.li];
    h+='<button class="m-card hide" data-idx="'+i+'">'+
       '<span class="face">'+(c.up?L.n:L.l)+'</span><span class="back">❓</span></button>';
  });
  $('matchGrid').innerHTML=h;
  $('matchInfo').textContent='🃏 翻开两张卡片，把大写和小写字母配成一对！(已配 '+matchPairs+'/'+MATCH_PAIRS+')';
}
$('matchGrid').addEventListener('click',function(e){
  var b=e.target.closest('.m-card');if(!b||matchLocked)return;
  var idx=parseInt(b.getAttribute('data-idx'),10),c=matchCards[idx];
  if(c.up&&matchOpen.length===1&&matchCards[matchOpen[0]].li===c.li&&matchCards[matchOpen[0]].up===true)return;
  if(matchOpen.indexOf(idx)>-1||b.classList.contains('matched'))return;
  b.classList.remove('hide');b.classList.add('show');
  matchOpen.push(idx);
  lastMatchLi=c.li;speakLetterName(c.li);
  if(matchOpen.length===2){
    matchLocked=true;matchMoves++;
    var a=matchOpen[0],bb=matchOpen[1],ca=matchCards[a],cb=matchCards[bb];
    var am=$('matchGrid').children[a],bm=$('matchGrid').children[bb];
    if(ca.li===cb.li&&ca.up!==cb.up){
      playCorrect();
      matchPairs++;addCorrect(ca.li);speakLetterName(ca.li);
      setTimeout(function(){
        am.classList.add('matched');bm.classList.add('matched');
        matchOpen=[];matchLocked=false;
        $('matchInfo').textContent='🃏 太棒了，配成一对！(已配 '+matchPairs+'/'+MATCH_PAIRS+')';
        if(matchPairs>=MATCH_PAIRS)finishMatch();
      },450);
    }else{
      playWrong();
      toast('再试一次！🔁');
      setTimeout(function(){
        am.classList.remove('show');am.classList.add('hide');
        bm.classList.remove('show');bm.classList.add('hide');
        matchOpen=[];matchLocked=false;
      },750);
    }
  }
});
function finishMatch(){
  var stars=matchMoves<=9?3:(matchMoves<=13?2:1);
  $('mEndTitle').textContent='配对成功！';
  $('mEndScore').textContent='用了 '+matchMoves+' 步配完 '+MATCH_PAIRS+' 对字母';
  showEndStars($('mEndStars'),stars);
  $('matchEnd').classList.add('show');
  $('matchInfo').textContent='';
  addStars(stars);
  if(stars===3)confetti();
}
$('matchAgain').addEventListener('click',newMatch);
$('matchReplay').addEventListener('click',function(){
  if(lastMatchLi>=0){speakLetterName(lastMatchLi);}
  else{toast('先翻开一张卡片吧 🃏');}
});
var lastMatchLi=-1;

/* ================= 句型 ================= */
var SENT_PATTERNS=[
 {p:'This is ...',cn:'这是……（近处·单数）',ex:'This is a cat.',exCn:'这是一只猫。',em:'🐱'},
 {p:'That is ...',cn:'那是……（远处·单数）',ex:'That is a dog.',exCn:'那是一只狗。',em:'🐶'},
 {p:'It is ...',cn:'它是……（介绍/图片）',ex:'It is a bird.',exCn:'它是一只鸟。',em:'🐦'},
 {p:'These are ...',cn:'这些是……（近处·复数）',ex:'These are apples.',exCn:'这些是苹果。',em:'🍎'},
 {p:'Those are ...',cn:'那些是……（远处·复数）',ex:'Those are bananas.',exCn:'那些是香蕉。',em:'🍌'}
];
var SENT_QUIZ=[
 {em:'🐱',cn:'指着近处的一只猫',q:'This is a cat.',dist:['That is a cat.','It is a cat.','These are cats.']},
 {em:'🐶',cn:'指着远处的一只狗',q:'That is a dog.',dist:['This is a dog.','It is a dog.','Those are dogs.']},
 {em:'🐦',cn:'介绍照片里的一只鸟',q:'It is a bird.',dist:['This is a bird.','That is a bird.','These are birds.']},
 {em:'🍎',cn:'指着近处的几个苹果',q:'These are apples.',dist:['This is an apple.','That is an apple.','Those are apples.']},
 {em:'🍌',cn:'指着远处的几根香蕉',q:'Those are bananas.',dist:['These are bananas.','That is a banana.','This is a banana.']},
 {em:'🐘',cn:'指着近处的一头大象',q:'This is an elephant.',dist:['That is an elephant.','It is an elephant.','These are elephants.']},
 {em:'🐟',cn:'指着远处的一条鱼',q:'That is a fish.',dist:['This is a fish.','It is a fish.','These are fish.']},
 {em:'🧸',cn:'介绍你的玩具熊',q:'It is a teddy bear.',dist:['This is a teddy bear.','That is a teddy bear.','These are teddy bears.']},
 {em:'🦆',cn:'指着近处的几只鸭子',q:'These are ducks.',dist:['This is a duck.','That is a duck.','Those are ducks.']},
 {em:'🚗',cn:'指着远处的一辆车',q:'That is a car.',dist:['This is a car.','It is a car.','Those are cars.']}
];
var sentList=[],sentIdx=0,sentCorrect=0,sentBusy=false;
function renderPats(){
  var h='';
  SENT_PATTERNS.forEach(function(p,i){
    h+='<button class="pat-card" data-p="'+i+'" style="background:'+letterColor(i+2)+'">'+
       '<div class="pat-em">'+p.em+'</div><div class="pat-p">'+p.p+'</div>'+
       '<div class="pat-ex">'+p.ex+'</div><div class="pat-cn">'+(cnOn?p.cn+' · '+p.exCn:'')+'</div></button>';
  });
  $('patGrid').innerHTML=h;
  var cards=$('patGrid').querySelectorAll('.pat-card');
  for(var i=0;i<cards.length;i++){
    (function(card){
      card.addEventListener('click',function(){speak(SENT_PATTERNS[Number(card.getAttribute('data-p'))].ex,0.68);});
    })(cards[i]);
  }
}
function newSent(){
  sentList=shuffle(SENT_QUIZ.map(function(_,i){return i;}));
  sentIdx=0;sentCorrect=0;sentBusy=false;
  $('sentEnd').classList.remove('show');
  $('sentPrompt').style.display='';$('sentOptions').style.display='';
  renderSent();
}
function renderSent(){
  var si=sentList[sentIdx],S=SENT_QUIZ[si];
  $('sentProgress').innerHTML='第 '+(sentIdx+1)+' 题 / 共 '+sentList.length+' 题 · 答对 '+sentCorrect+' 题'+
    '<div class="bar"><i style="width:'+(sentIdx/sentList.length*100)+'%"></i></div>';
  $('sentPrompt').innerHTML='<div class="sent-scene">'+S.em+'</div>'+
    '<div class="sent-hint">'+S.cn+'</div>'+
    '<button class="q-replay" id="sentReplay">🔊 听一听怎么说</button>';
  var opts=shuffle([S.q].concat(S.dist.slice()));
  var h='';
  opts.forEach(function(o){
    h+='<button class="s-opt" data-t="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>';
  });
  $('sentOptions').innerHTML=h;
  $('sentReplay').onclick=function(){speak(S.q,0.68);};
}
$('sentOptions').addEventListener('click',function(e){
  var b=e.target.closest('.s-opt');if(!b||sentBusy)return;
  sentBusy=true;var S=SENT_QUIZ[sentList[sentIdx]];
  var btns=$('sentOptions').querySelectorAll('.s-opt'),correctBtn=null;
  btns.forEach(function(x){if(x.textContent.trim()===S.q)correctBtn=x;});
  if(b.textContent.trim()===S.q){
    playCorrect();
    b.classList.add('correct');sentCorrect++;
    toast(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    confetti();
    speak(S.q,0.68);
  }else{
    playWrong();
    b.classList.add('wrong');if(correctBtn)correctBtn.classList.add('correct');
    toast(ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]);
    speak(S.q,0.68);
  }
  setTimeout(function(){
    sentIdx++;
    if(sentIdx>=sentList.length)finishSent();
    else{sentBusy=false;renderSent();}
  },1400);
});
function finishSent(){
  var stars=sentCorrect>=sentList.length?3:(sentCorrect/sentList.length>=0.7?2:1);
  $('sentPrompt').style.display='none';$('sentOptions').style.display='none';
  $('sentEndTitle').textContent=sentCorrect===sentList.length?'全对，句型小达人！':'句型闯关完成！';
  $('sentEndScore').textContent='答对 '+sentCorrect+' / '+sentList.length+' 题';
  showEndStars($('sentEndStars'),stars);
  $('sentEnd').classList.add('show');
  addStars(stars);
  if(stars===3)confetti();
}
$('sentAgain').addEventListener('click',newSent);
function showSentPane(which){
  $('sentLearnTab').classList.toggle('active',which==='learn');
  $('sentQuizTab').classList.toggle('active',which==='quiz');
  $('sentOrderTab').classList.toggle('active',which==='order');
  $('sentLearn').classList.toggle('show',which==='learn');
  $('sentQuiz').classList.toggle('show',which==='quiz');
  $('sentOrder').classList.toggle('show',which==='order');
}
$('sentLearnTab').addEventListener('click',function(){showSentPane('learn');});
$('sentQuizTab').addEventListener('click',function(){showSentPane('quiz');});
$('sentOrderTab').addEventListener('click',function(){showSentPane('order');newSentOrder();});

/* ================= 组句 ================= */
var ORDER_LEN=6;
var orderList=[],orderIdx=0,orderScore=0,orderBusy=false;
function sentWordsOf(S){return S.q.replace(/\./g,'').split(' ');}
function newSentOrder(){
  orderList=shuffle(SENT_QUIZ.map(function(_,i){return i;})).slice(0,ORDER_LEN);
  orderIdx=0;orderScore=0;orderBusy=false;
  $('sentOrderEnd').classList.remove('show');
  $('sentOrderPrompt').style.display='';$('orderAnswer').style.display='';$('orderBank').style.display='';
  renderSentOrder();
}
function renderSentOrder(){
  var si=orderList[orderIdx],S=SENT_QUIZ[si],words=sentWordsOf(S);
  $('sentOrderProgress').innerHTML='第 '+(orderIdx+1)+' 题 / 共 '+orderList.length+' 题 · 排对 '+orderScore+' 题'+
    '<div class="bar"><i style="width:'+(orderIdx/orderList.length*100)+'%"></i></div>';
  $('sentOrderPrompt').innerHTML='<div class="sent-scene">'+S.em+'</div>'+
    '<div class="sent-hint">'+S.cn+'</div>'+
    '<button class="q-replay" id="orderReplay">🔊 听句子</button>';
  var rp=$('orderReplay');if(rp)rp.onclick=function(){speak(S.q,0.68);};
  $('orderAnswer').innerHTML='';
  $('orderBank').innerHTML='';
  var bank=shuffle(words.slice());
  bank.forEach(function(w){
    var b=document.createElement('button');
    b.className='word-chip2';b.textContent=w;b.setAttribute('data-w',w);
    $('orderBank').appendChild(b);
  });
  $('orderAnswer').classList.remove('wrong');
  $('orderAnswer').style.outline='';
}
function checkOrder(){
  var si=orderList[orderIdx],S=SENT_QUIZ[si],words=sentWordsOf(S);
  var placed=$('orderAnswer').querySelectorAll('.word-chip2');
  if(placed.length<words.length)return;
  var ok=true;
  for(var i=0;i<words.length;i++){if(placed[i].textContent!==words[i]){ok=false;break;}}
  if(ok){
    orderScore++;orderBusy=true;
    playCorrect();
    $('orderAnswer').style.outline='3px solid #4cd97b';
    toast('句子排对啦！🎉');confetti();
    setTimeout(function(){
      orderBusy=false;
      orderIdx++;
      if(orderIdx>=orderList.length)finishSentOrder();
      else{renderSentOrder();}
    },1300);
  }else{
    playWrong();
    $('orderAnswer').classList.remove('wrong');void $('orderAnswer').offsetWidth;$('orderAnswer').classList.add('wrong');
    toast('顺序不太对，再试试！🔁');
    var pl=$('orderAnswer').querySelectorAll('.word-chip2');
    for(var k=pl.length-1;k>=0;k--){$('orderBank').appendChild(pl[k]);pl[k].classList.remove('placed');}
  }
}
function finishSentOrder(){
  var stars=orderScore>=orderList.length?3:(orderScore/orderList.length>=0.7?2:1);
  $('sentOrderPrompt').style.display='none';$('orderAnswer').style.display='none';$('orderBank').style.display='none';
  $('sentOrderEndTitle').textContent=orderScore===orderList.length?'全对，组句小达人！':'组句完成！';
  $('sentOrderEndScore').textContent='排对 '+orderScore+' / '+orderList.length+' 题';
  showEndStars($('sentOrderEndStars'),stars);
  $('sentOrderEnd').classList.add('show');
  addStars(stars);
  if(stars===3)confetti();
}
$('sentOrderAgain').addEventListener('click',newSentOrder);
$('orderReset').addEventListener('click',function(){
  if(orderBusy)return;
  var pl=$('orderAnswer').querySelectorAll('.word-chip2');
  for(var k=pl.length-1;k>=0;k--){$('orderBank').appendChild(pl[k]);pl[k].classList.remove('placed');}
});
// 点选 / 拖动组句（委托监听，避免重复绑定）
var dragChip=null,dragMoved=false,dragSX=0,dragSY=0;
$('sentOrder').addEventListener('pointerdown',function(e){
  var b=e.target.closest('.word-chip2');
  if(!b||orderBusy)return;
  dragChip=b;dragMoved=false;dragSX=e.clientX;dragSY=e.clientY;
  try{b.setPointerCapture(e.pointerId);}catch(err){}
});
$('sentOrder').addEventListener('pointermove',function(e){
  if(!dragChip)return;
  var dx=e.clientX-dragSX,dy=e.clientY-dragSY;
  if(!dragMoved&&Math.abs(dx)+Math.abs(dy)>10){dragMoved=true;}
  if(dragMoved){
    dragChip.style.position='fixed';dragChip.style.left=(e.clientX-34)+'px';
    dragChip.style.top=(e.clientY-20)+'px';dragChip.style.zIndex='999';
    dragChip.classList.add('dragging');
  }
});
$('sentOrder').addEventListener('pointerup',function(e){
  if(!dragChip)return;
  var b=dragChip;
  if(dragMoved){
    var ans=$('orderAnswer').getBoundingClientRect();
    var inAns=e.clientX>=ans.left&&e.clientX<=ans.right&&e.clientY>=ans.top&&e.clientY<=ans.bottom;
    if(inAns&&!$('orderAnswer').contains(b)){
      $('orderAnswer').appendChild(b);b.classList.add('placed');checkOrder();
    }else if(!inAns&&$('orderAnswer').contains(b)){
      $('orderBank').appendChild(b);b.classList.remove('placed');
    }
    b.style.position='';b.style.left='';b.style.top='';b.style.zIndex='';b.classList.remove('dragging');
    b._suppressClick=true;setTimeout(function(){b._suppressClick=false;},80);
  }
  dragChip=null;
});
$('sentOrder').addEventListener('click',function(e){
  var b=e.target.closest('.word-chip2');
  if(!b||orderBusy||b._suppressClick)return;
  var ans=$('orderAnswer');
  if(ans.contains(b)){
    $('orderBank').appendChild(b);b.classList.remove('placed');
  }else{
    ans.appendChild(b);b.classList.add('placed');checkOrder();
  }
});
